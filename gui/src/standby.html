<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><text x='16' y='23' text-anchor='middle' font-size='20' fill='%23f5f5f7' font-family='sans-serif'>余</text></svg>" />
<title>剩余</title>
<style>
  html {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    background: #000;
    color-scheme: dark;
  }
  body {
    margin: 0;
    background: #000;
    color: #f5f5f7;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .shell {
    min-height: 100dvh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .top { flex: none; padding: 18px 20px 6px; }
  .pill {
    display: inline-block;
    margin: 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: #1c1c1e;
    color: #f5f5f7;
    font-size: 13px;
    font-weight: 600;
  }
  .list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 8px 20px 28px;
  }
  .card { padding: 14px 0 8px; }
  .card h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #f5f5f7;
  }
  .plan { margin: 2px 0 0; font-size: 13px; color: #98989f; }
  .hero-pct {
    margin-top: 8px;
    font-size: 64px;
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .track { height: 2px; margin: 12px 0 8px; background: #2c2c2e; }
  .bar { height: 2px; }
  .meta, .win { display: flex; align-items: baseline; gap: 12px; }
  .label, .reset, .empty { color: #98989f; font-size: 14px; }
  .empty { margin: 28px 0; }
  .win { margin-top: 14px; }
  .win-pct {
    font-size: 28px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 4.5ch;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none; animation: none; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="top"><p id="pill" class="pill">连接中</p></div>
    <div id="list" class="list"><p class="empty">等待配额</p></div>
  </div>
<script>
function fmtReset(ms) {
  if (ms < 60000) return '<1m';
  const m = Math.round(ms / 60000);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h' + (m % 60 ? (m % 60) + 'm' : '');
  return Math.floor(h / 24) + 'd' + (h % 24 ? (h % 24) + 'h' : '');
}

function resetText(ms) {
  if (typeof ms === 'number' && ms > 0) return fmtReset(ms) + ' 后重置';
  return '';
}

function color(level) {
  if (level === 'warn') return '#ffd60a';
  if (level === 'out') return '#ff453a';
  return '#30d158';
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function hero(item) {
  const block = el('div', 'hero');
  const pct = el('div', 'hero-pct', item.remainingPct + '%');
  pct.style.color = color(item.level);
  const track = el('div', 'track');
  const bar = el('div', 'bar');
  bar.style.width = item.remainingPct + '%';
  bar.style.background = color(item.level);
  track.append(bar);
  const meta = el('div', 'meta');
  meta.append(el('span', 'label', item.label));
  const reset = resetText(item.resetsInMs);
  if (reset) meta.append(el('span', 'reset', reset));
  block.append(pct, track, meta);
  return block;
}

function row(item) {
  const line = el('div', 'win');
  const pct = el('span', 'win-pct', item.remainingPct + '%');
  pct.style.color = color(item.level);
  line.append(pct, el('span', 'label', item.label));
  const reset = resetText(item.resetsInMs);
  if (reset) line.append(el('span', 'reset', reset));
  return line;
}

function paint(doc) {
  const pill = document.getElementById('pill');
  const list = document.getElementById('list');
  if (doc.state === 'waiting') {
    pill.textContent = '连接中';
    list.replaceChildren(el('p', 'empty', '等待配额'));
    return;
  }
  if (doc.state !== 'ready') return;
  pill.textContent = doc.stale ? '数据滞后' : '实时';
  if (doc.cards.length === 0) {
    list.replaceChildren(el('p', 'empty', '没有可显示的配额'));
    return;
  }
  const nodes = doc.cards.map(function (card) {
    const article = el('article', 'card');
    article.append(el('h2', null, card.title));
    if (card.plan) article.append(el('p', 'plan', card.plan));
    card.windows.forEach(function (item, index) {
      article.append(index === 0 ? hero(item) : row(item));
    });
    return article;
  });
  list.replaceChildren.apply(list, nodes);
}

async function load() {
  try {
    const response = await fetch('/api/summary', { cache: 'no-store' });
    if (!response.ok) throw new Error(String(response.status));
    paint(await response.json());
  } catch (e) {
    document.getElementById('pill').textContent = '等待数据';
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
