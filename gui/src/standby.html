<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Token Monitor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    background: #000; color: #f5f5f7; overflow: hidden;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  /* 暗房里的 Standby:纯黑之上一点极微弱的冷光晕 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 70% at 50% -10%, #10131f66 0%, transparent 60%);
  }
  .deck { height: 100dvh; display: flex; flex-direction: column; position: relative; }
  /* ── 顶栏:Standby 式细体时钟 + 材质状态 pill ── */
  .topbar {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 24px 10px;
  }
  .clockbox { line-height: 1.05; }
  .clock {
    font-size: 30px; font-weight: 200; letter-spacing: 0.01em; color: #f5f5f7;
    font-variant-numeric: tabular-nums;
  }
  .clock .sec { font-size: 15px; color: #636366; font-weight: 300; margin-left: 3px; }
  .clock .colons { animation: breathe 2s ease-in-out infinite; }
  .date { font-size: 12px; font-weight: 500; color: #98989f; letter-spacing: 0.04em; margin-top: 2px; }
  .fresh {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(120, 120, 128, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.06);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    font-size: 12px; font-weight: 500; color: #c7c7cc;
  }
  .fresh i { width: 7px; height: 7px; border-radius: 50%; background: #30d158; box-shadow: 0 0 8px #30d15888; }
  .fresh.stale i { background: #ffd60a; box-shadow: 0 0 8px #ffd60a88; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  /* ── 视图轨道 ── */
  .track {
    flex: 1; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .track::-webkit-scrollbar { display: none; }
  .view { flex: 0 0 100%; scroll-snap-align: center; overflow-y: auto; padding: 4px 18px 22px; -webkit-overflow-scrolling: touch; }
  .dots { flex: none; display: flex; justify-content: center; gap: 8px; padding: 12px 0 calc(14px + env(safe-area-inset-bottom)); }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.18); transition: background 0.25s, transform 0.25s; }
  .dots i.on { background: #f5f5f7; transform: scale(1.2); }
  /* ── iOS 材质卡:内光边 + 深阴影 ── */
  .card {
    position: relative;
    background: rgba(120, 120, 128, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.07);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    border-radius: 24px; padding: 20px 20px 18px; margin-bottom: 14px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  }
  .card h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #98989f; text-transform: uppercase; margin-bottom: 12px; }
  /* ── 大数字 ── */
  .big { font-size: clamp(44px, 13vw, 78px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; }
  .big small { font-size: 0.4em; font-weight: 600; color: #98989f; letter-spacing: 0; margin-left: 7px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > .card { flex: 1 1 240px; }
  .sub { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; color: #98989f; }
  .sub b { color: #f5f5f7; font-weight: 600; }
  /* 数字更新微动效 */
  @keyframes rise { from { opacity: 0.25; transform: translateY(7px); filter: blur(1.5px); } to { opacity: 1; transform: none; filter: none; } }
  .tick { animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.3, 1); }
  /* ── iOS 分段控件:弹性滑块 ── */
  .seg { position: relative; display: inline-flex; background: rgba(120, 120, 128, 0.18); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 11px; padding: 2px; }
  .seg .thumb {
    position: absolute; top: 2px; bottom: 2px; border-radius: 9px; background: #f5f5f7;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    transition: transform 0.32s cubic-bezier(0.3, 1.2, 0.4, 1), width 0.32s cubic-bezier(0.3, 1.2, 0.4, 1);
  }
  .seg button {
    position: relative; z-index: 1; border: 0; background: transparent; color: #c7c7cc; font: inherit;
    font-size: 13px; font-weight: 600; padding: 6px 16px; border-radius: 9px; cursor: pointer;
    transition: color 0.25s;
  }
  .seg button.on { color: #000; }
  /* ── 环卡网格 ── */
  .rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .ring-card { display: flex; align-items: center; gap: 16px; }
  .ring-card svg { width: 88px; height: 88px; flex: none; }
  .ring-copy { min-width: 0; flex: 1; }
  .ring-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .ring-name i { width: 4px; height: 15px; border-radius: 2px; background: var(--accent, #0a84ff); flex: none; }
  .ring-copy .plan { font-size: 12px; color: #98989f; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ring-copy .reset { font-size: 12px; color: #98989f; margin-top: 4px; }
  .ring-num { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .ring-card path { transition: opacity 0.3s ease; }
  /* ── 时段柱 ── */
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
  .bars i { flex: 1; min-height: 3px; border-radius: 3px 3px 0 0; background: #5e5ce6; opacity: 0.92; transform-origin: bottom; }
  .bars i.peak { background: #30d158; box-shadow: 0 0 12px #30d15844; }
  .scale { display: flex; justify-content: space-between; font-size: 10px; color: #636366; margin-top: 6px; }
  .empty { color: #636366; font-size: 14px; padding: 30px 0; text-align: center; }
  .brand { font-size: 10px; letter-spacing: 0.34em; color: #48484a; text-align: center; padding-bottom: 4px; }
  .quota-head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 2px 14px; }
  .quota-head-row h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: #f5f5f7; text-transform: none; }
  /* ── 横屏 focus:单套餐大卡,上下滑切换 ── */
  .focus { flex: 1; min-height: 0; display: flex; flex-direction: column; touch-action: none; }
  .focus-inner { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; min-height: 0; overflow: hidden; }
  .focus-inner.snap-out { opacity: 0; transform: translateY(var(--focus-dir, 14px)) scale(0.985); }
  .focus-inner { transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.3, 1.1, 0.4, 1); }
  .focus-ring-wrap { position: relative; display: grid; place-items: center; flex: none; }
  .focus-ring-wrap svg { width: min(30vh, 250px); height: min(30vh, 250px); }
  .focus-pct { position: absolute; text-align: center; }
  .focus-pct b { font-size: clamp(28px, 8vh, 54px); font-weight: 200; letter-spacing: -0.02em; }
  .focus-pct i { display: block; font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: #98989f; margin-top: 3px; }
  .focus-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-align: center; display: flex; align-items: center; gap: 9px; justify-content: center; }
  .focus-name i { width: 4px; height: 16px; border-radius: 2px; background: var(--accent, #0a84ff); }
  .focus-plan { font-size: 12px; color: #98989f; text-align: center; margin-top: 3px; }
  .focus-wins { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; flex: none; }
  .focus-wins .win {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: rgba(120, 120, 128, 0.14); border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px; padding: 9px 16px; min-width: 84px;
  }
  .focus-wins .win b { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .focus-wins .win span { font-size: 10px; color: #98989f; letter-spacing: 0.1em; }
  .focus-wins .win small { font-size: 9px; color: #636366; }
  .focus-dots { flex: none; display: flex; justify-content: center; gap: 7px; padding: 10px 0 2px; }
  .focus-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.18); transition: background 0.25s; }
  .focus-dots i.on { background: #f5f5f7; }
  /* 横屏:配额视图切 focus;隐藏 brand 与三视图圆点,顶栏收紧 */
  @media (orientation: landscape) {
    #viewQuota { overflow: hidden; display: flex; flex-direction: column; }
    #viewQuota .quota-head-row { justify-content: center; }
    #viewQuota .rings, #viewQuota #ringsEmpty { display: none !important; }
    #focusPane { display: flex; }
    .brand, .dots { display: none; }
    .topbar { padding: 10px 24px 4px; }
    .clock { font-size: 22px; }
    .date { display: none; }
    .deck { height: 100vh; }
    .focus-wins .win { padding: 7px 13px; min-width: 76px; border-radius: 13px; }
    .focus-wins .win b { font-size: 18px; }
    .focus-name { font-size: 15px; }
    .focus-plan { font-size: 11px; }
    .focus-inner { gap: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dots i, .seg .thumb, .seg button, .ring-card path, .focus-inner, .focus-dots i { transition: none !important; }
    .clock .colons { animation: none; }
    .tick { animation: none; }
  }
</style>
</head>
<body>
<div class="deck">
  <div class="topbar">
    <div class="clockbox">
      <div class="clock" id="clock">--<span class="colons">:</span>--<span class="sec"></span></div>
      <div class="date" id="date"></div>
    </div>
    <span class="fresh" id="fresh"><i></i><span id="freshText">连接中</span></span>
  </div>
  <div class="track" id="track">
    <section class="view" id="viewQuota">
      <div class="quota-head-row">
        <h3>订阅配额</h3>
        <div class="seg" id="quotaSeg" role="tablist">
          <span class="thumb"></span>
          <button type="button" class="on" data-view="used">已用</button>
          <button type="button" data-view="left">剩余</button>
        </div>
      </div>
      <div class="rings" id="rings"></div>
      <div class="empty" id="ringsEmpty" hidden>等待配额数据…</div>
      <div class="focus" id="focusPane" hidden>
        <div class="focus-inner" id="focusInner"></div>
        <div class="focus-dots" id="focusDots"></div>
      </div>
    </section>
    <section class="view" id="viewUsage">
      <div class="seg" id="seg" role="tablist">
        <span class="thumb"></span>
        <button type="button" class="on" data-period="today">今日</button>
        <button type="button" data-period="week">本周</button>
        <button type="button" data-period="month">本月</button>
      </div>
      <div class="card">
        <h3>Tokens</h3>
        <div class="big" id="pTokens">—</div>
        <div class="sub" id="pTokensSub"></div>
      </div>
      <div class="row">
        <div class="card"><h3>请求</h3><div class="big" id="pRequests" style="font-size:clamp(36px,10vw,58px)">—</div></div>
        <div class="card"><h3>花费</h3><div class="big" id="pCost" style="font-size:clamp(36px,10vw,58px)">—</div></div>
      </div>
      <div class="card" id="burnCard" hidden>
        <h3>当前燃烧率</h3>
        <div class="big" id="burn" style="font-size:clamp(30px,8vw,46px)">—</div>
      </div>
    </section>
    <section class="view" id="viewHours">
      <div class="card">
        <h3>30 天活跃时段 · 24H</h3>
        <div class="bars" id="bars"></div>
        <div class="scale"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>
        <div class="sub" id="peakLine"></div>
      </div>
      <div class="card" id="valueCard" hidden>
        <h3>本月 API 等价价值</h3>
        <div class="big" id="value">$—</div>
        <div class="sub" id="valueSub"></div>
      </div>
    </section>
  </div>
  <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
  <div class="brand">TOKEN MONITOR</div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const fmtTokens = (n) => {
    if (!Number.isFinite(n)) return '—';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  };
  const fmtMoney = (n) => n == null || !Number.isFinite(n) ? '—' : '$' + n.toFixed(2);
  const fmtReset = (ms) => {
    if (ms == null || ms <= 0) return '';
    const m = Math.round(ms / 60000);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h' + (m % 60 ? (m % 60) + 'm' : '');
    return Math.floor(h / 24) + 'd' + (h % 24 ? (h % 24) + 'h' : '');
  };
  const LEVEL = ['#30d158', '#ffd60a', '#ff453a'];
  // 套餐主色(iOS 系统色系),标题色条与 focus 环光晕用
  const ACCENT = {
    'opencode-go': '#5e5ce6', codex: '#0a84ff', goat: '#ff9f0a', 'antigravity': '#64d2ff',
    'claude': '#bf5af2', cursor: '#ffffff', glm: '#30d158', kimi: '#ff453a',
  };
  const accentOf = (title) => ACCENT[title.toLowerCase().split(' ')[0]] || '#0a84ff';

  // 文本更新:变了才写并触发 rise 微动效
  const setText = (el, html) => {
    if (el.innerHTML === html) return;
    el.innerHTML = html;
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
  };

  // iOS 分段滑块:thumb 跟随选中项(transform+width 弹性过渡)
  function bindSeg(container, onPick) {
    const thumb = container.querySelector('.thumb');
    const buttons = [...container.querySelectorAll('button')];
    const place = (button) => {
      thumb.style.width = button.offsetWidth + 'px';
      thumb.style.transform = `translateX(${button.offsetLeft - 2}px)`;
    };
    const selected = () => buttons.find((b) => b.classList.contains('on')) || buttons[0];
    container.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      buttons.forEach((b) => b.classList.toggle('on', b === button));
      place(button);
      onPick(button);
    });
    requestAnimationFrame(() => place(selected()));
    window.addEventListener('resize', () => place(selected()));
    return { place, selected };
  }

  // 时钟:HH:MM 细体 + 呼吸冒号 + 秒;日期一行
  function tickClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    $('clock').innerHTML = `${hh}<span class="colons">:</span>${mm}<span class="sec">${String(now.getSeconds()).padStart(2, '0')}</span>`;
    $('date').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // 视图轻扫与圆点同步
  const track = $('track');
  const dots = [...$('dots').children];
  track.addEventListener('scroll', () => {
    const index = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach((dot, i) => dot.classList.toggle('on', i === index));
  }, { passive: true });

  // 已用/剩余口径(与桌面同语义:展示翻转,状态色按已用)
  let usedView = true;
  try { usedView = localStorage.getItem('tm-lan-used-view') !== 'left'; } catch { /* session only */ }
  const syncQuotaSeg = () => {
    [...$('quotaSeg').children].forEach((b) => {
      if (b.tagName === 'BUTTON') b.classList.toggle('on', (b.dataset.view === 'left') === !usedView);
    });
  };
  bindSeg($('quotaSeg'), (button) => {
    usedView = button.dataset.view !== 'left';
    try { localStorage.setItem('tm-lan-used-view', usedView ? 'used' : 'left'); } catch { /* session only */ }
    render(last);
  });
  syncQuotaSeg();

  let period = 'today';
  bindSeg($('seg'), (button) => {
    period = button.dataset.period;
    render(last);
  });

  // 分块环:24 段,亮段按序波浪点亮(每段 transitionDelay 递增)
  const SEGMENTS = 24;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const segPath = (cx, cy, r, index) => {
    const gap = 2;
    const start = (index * 360) / SEGMENTS - 90 + gap / 2;
    const end = ((index + 1) * 360) / SEGMENTS - 90 - gap / 2;
    const rad = (deg) => (deg * Math.PI) / 180;
    const x1 = cx + r * Math.cos(rad(start)), y1 = cy + r * Math.sin(rad(start));
    const x2 = cx + r * Math.cos(rad(end)), y2 = cy + r * Math.sin(rad(end));
    return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  };
  const ringSvg = (pct, level, accent) => {
    const lit = Math.round(Math.min(pct, 100) / 100 * SEGMENTS);
    const color = LEVEL[Math.min(level, 2)];
    let paths = `<circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6.5" />`;
    for (let i = 0; i < SEGMENTS; i++) {
      const delay = reducedMotion ? 0 : i * 14;
      paths += `<path d="${segPath(42, 42, 36, i)}" stroke="${i < lit ? color : 'rgba(255,255,255,0.10)'}" stroke-width="6.5" fill="none" stroke-linecap="round" style="transition-delay:${delay}ms"/>`;
    }
    return `<svg viewBox="0 0 84 84" aria-hidden="true">${paths}</svg>`;
  };

  let last = null;

  // 横屏 focus 模式:单一套餐,上下滑切换
  let isLandscape = matchMedia('(orientation: landscape)').matches;
  let focusIndex = 0;
  let groupedOf = () => {
    const map = new Map();
    ((last || {}).rings || []).forEach((ring) => {
      const key = ring.title + '|' + ring.planType;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(ring);
    });
    return [...map.entries()];
  };
  matchMedia('(orientation: landscape)').addEventListener('change', (event) => {
    isLandscape = event.matches;
    render(last);
  });

  function focusHtml() {
    const groups = groupedOf();
    if (!groups.length) return '<div class="empty">等待配额数据…</div>';
    focusIndex = ((focusIndex % groups.length) + groups.length) % groups.length;
    const [, list] = groups[focusIndex];
    const head = list[0];
    const tightest = list.reduce((a, b) => (b.usedPct > a.usedPct ? b : a));
    const displayPct = (pct) => (usedView ? pct : 100 - pct);
    const accent = accentOf(head.title);
    const wins = list.map((ring) => `
      <div class="win">
        <b style="color:${LEVEL[Math.min(ring.level, 2)]}">${Math.round(displayPct(ring.usedPct))}%</b>
        <span>${ring.label}</span>
        ${ring.resetsInMs ? `<small>${fmtReset(ring.resetsInMs)} 后重置</small>` : ''}
      </div>`).join('');
    const dotsHtml = groups.map((_, i) => `<i class="${i === focusIndex ? 'on' : ''}"></i>`).join('');
    return `
      <div class="focus-ring-wrap">
        ${ringSvg(displayPct(tightest.usedPct), tightest.level, accent)}
        <div class="focus-pct">
          <b style="color:${LEVEL[Math.min(tightest.level, 2)]}">${Math.round(displayPct(tightest.usedPct))}%</b>
          <i>${usedView ? '已用' : '剩余'} · ${tightest.label}</i>
        </div>
      </div>
      <div>
        <div class="focus-name" style="--accent:${accent}"><i></i>${head.title}</div>
        <div class="focus-plan">${head.planType || ''}</div>
      </div>
      <div class="focus-wins">${wins}</div>
      <div class="focus-dots">${dotsHtml}</div>`;
  }

  // 上下滑:垂直主导手势翻页,带方向过渡
  (() => {
    const pane = $('focusPane');
    let startY = null;
    let startX = null;
    pane.addEventListener('touchstart', (event) => {
      startY = event.touches[0].clientY;
      startX = event.touches[0].clientX;
    }, { passive: true });
    pane.addEventListener('touchend', (event) => {
      if (startY == null) return;
      const dy = event.changedTouches[0].clientY - startY;
      const dx = event.changedTouches[0].clientX - startX;
      startY = startX = null;
      if (Math.abs(dy) < 48 || Math.abs(dx) > Math.abs(dy)) return;
      const groups = groupedOf();
      if (groups.length < 2) return;
      const direction = dy < 0 ? 1 : -1; // 上滑=下一个,下滑=上一个
      const inner = $('focusInner');
      inner.style.setProperty('--focus-dir', `${direction * 20}px`);
      inner.classList.add('snap-out');
      setTimeout(() => {
        focusIndex += direction;
        inner.innerHTML = focusHtml();
        inner.classList.remove('snap-out');
      }, 190);
    }, { passive: true });
  })();

  function render(data) {
    last = data;
    const displayPct = (pct) => (usedView ? pct : 100 - pct);
    // 配额环:同套餐多窗口聚合;竖屏网格
    const grouped = groupedOf();
    $('rings').innerHTML = grouped.map(([, list]) => {
      const head = list[0];
      const tightest = list.reduce((a, b) => (b.usedPct > a.usedPct ? b : a));
      const accent = accentOf(head.title);
      const chips = list.map((ring) => `
        <div class="ring-copy" style="margin-top:9px">
          <span class="ring-num" style="color:${LEVEL[Math.min(ring.level, 2)]}">${Math.round(displayPct(ring.usedPct))}%</span>
          <span class="plan" style="margin-left:6px">${ring.label}${ring.resetsInMs ? ' · ' + fmtReset(ring.resetsInMs) + ' 后重置' : ''}</span>
        </div>`).join('');
      return `<div class="card ring-card">
        ${ringSvg(displayPct(tightest.usedPct), tightest.level, accent)}
        <div class="ring-copy">
          <div class="ring-name" style="--accent:${accent}"><i></i>${head.title}</div>
          <div class="plan">${head.planType || ''}</div>
          ${chips}
        </div>
      </div>`;
    }).join('');
    $('ringsEmpty').hidden = grouped.size > 0;
    if (isLandscape) $('focusInner').innerHTML = focusHtml();

    // 用量(按所选时间段)
    const periodData = data[period] || {};
    setText($('pTokens'), fmtTokens(periodData.tokens || 0));
    setText($('pRequests'), (periodData.messages || 0).toLocaleString());
    setText($('pCost'), fmtMoney(periodData.cost));
    const burn = data.burnRate;
    $('burnCard').hidden = !(burn > 0);
    if (burn > 0) setText($('burn'), fmtTokens(burn) + '<small>/min</small>');

    // 时段
    const hourly = data.hourly || [];
    if (hourly.length) {
      const max = Math.max(1, ...hourly);
      let peak = 0;
      hourly.forEach((v, i) => { if (v > hourly[peak]) peak = i; });
      $('bars').innerHTML = hourly.map((v, i) => `<i class="${i === peak && v > 0 ? 'peak' : ''}" style="height:${Math.max(3, v / max * 100)}%"></i>`).join('');
      setText($('peakLine'), `最活跃 <b>${String(peak).padStart(2, '0')}:00</b> 前后 · 30 天合计 <b>${fmtTokens(hourly.reduce((a, b) => a + b, 0))}</b>`);
    }
    const value = data.monthlyApiValueUsd;
    $('valueCard').hidden = !(value > 0);
    if (value > 0) {
      setText($('value'), fmtMoney(value));
      setText($('valueSub'), data.monthlyMultiple > 0 ? `约等于包月额度的 <b>${data.monthlyMultiple.toFixed(1)}×</b>` : '');
    }

    // 新鲜度
    const age = Date.now() - (data.generatedAtMs || 0);
    const stale = age > 120000;
    $('fresh').classList.toggle('stale', stale);
    setText($('freshText'), stale ? '数据滞后' : '实时');
  }

  async function poll() {
    try {
      const response = await fetch('/api/summary', { cache: 'no-store' });
      if (!response.ok) throw new Error(response.status);
      render(await response.json());
    } catch {
      $('fresh').classList.add('stale');
      setText($('freshText'), '等待数据');
    }
  }
  poll();
  setInterval(poll, 30000);
</script>
</body>
</html>
