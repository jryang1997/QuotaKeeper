<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token Monitor 悬浮窗</title>
<style>
  :root {
    color-scheme: dark;
    /* 玻璃调参位:材质与 Dock 同配方(blur+saturate 的 backdrop-filter 实时渲染),
       --glass-tint 是镜片之上的暗色覆膜,只负责文字可读性的深度,不负责糊度。 */
    --glass-tint: rgba(10, 13, 20, 0.30);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: "Sarasa Term SC Nerd", "Sarasa Mono SC", "Cascadia Mono", Consolas, monospace; }
  .svg-defs { position: absolute; width: 0; height: 0; pointer-events: none; }

  /* 液态玻璃分层(自下而上):
     .glass::before  Rust 推来的原始桌面像素(降采样,未糊) —— 玻璃"后面的世界"
     .lens           backdrop-filter 镜片:对下层像素实时 blur+saturate+提亮,
                     贴图就绪后再叠加 feDisplacementMap 折射(Dock 同款)
     .veil           顶部高光 sheen / 底部内阴影 / 暗 tint / 厚度圈
     .glass::after   1px 镜面 rim 亮环(左上最亮)
     玻璃边缘留 4px 不铺,让 tao 的 WM_NCHITTEST 拿到缩放命中。 */
  .glass {
    position: relative; isolation: isolate;
    display: flex; align-items: center;
    width: calc(100% - 8px); height: calc(100% - 8px);
    margin: 4px;
    padding: 8px 12px;
    border-radius: 999px;
    color: #eef2fa;
    overflow: hidden;
  }
  .glass::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    border-radius: inherit;
    background-color: var(--glass-tint);
    background-image: var(--backdrop, none);
    background-size: calc(100% + 8px) calc(100% + 8px);
    background-position: center;
    background-repeat: no-repeat;
  }
  .lens {
    position: absolute; inset: 0; z-index: 1;
    border-radius: inherit;
    pointer-events: none;
    -webkit-backdrop-filter: blur(26px) saturate(170%) brightness(1.05);
            backdrop-filter: blur(26px) saturate(170%) brightness(1.05);
  }
  /* 折射贴图就绪:换上真折射滤镜链(位移+模糊+提饱和,Dock 同款) */
  .glass.lens-ready { --lens-filter: url(#overlay-lens); }
  .glass.lens-ready .lens {
    -webkit-backdrop-filter: var(--lens-filter) blur(26px) saturate(170%) brightness(1.05);
            backdrop-filter: var(--lens-filter) blur(26px) saturate(170%) brightness(1.05);
  }
  .veil {
    position: absolute; inset: 0; z-index: 2;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04) 30%, rgba(255, 255, 255, 0) 55%),
      linear-gradient(0deg, rgba(2, 6, 14, 0.30), rgba(2, 6, 14, 0) 36%),
      linear-gradient(var(--glass-tint), var(--glass-tint));
    /* 玻璃厚度圈:边缘带一圈柔和的内阴影,也是折射带的路缘 */
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), inset 0 0 14px rgba(4, 8, 16, 0.22);
  }
  /* 抓不到桌面像素时(老系统/无权限):退化为自绘烟熏玻璃,镜片空转无害 */
  body.no-backdrop .glass::before {
    background: linear-gradient(165deg, #1c2537f2, #131a29ec 42%, #0b1018f5);
  }
  /* 镜面 rim:左上最亮 */
  .glass::after {
    content: ''; position: absolute; inset: 0; z-index: 3; border-radius: inherit; padding: 1px;
    background: linear-gradient(155deg, #ffffff78, #ffffff1e 32%, transparent 55%, #ffffff18 80%, #ffffff52);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
  }
  .inner { position: relative; z-index: 4; display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; }

  /* 环:默认态收成一枚,环外百分比 */
  .gauge { position: relative; flex: 0 0 auto; width: 58px; height: 58px; display: grid; place-items: center; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .gauge .track { stroke: rgba(255, 255, 255, 0.16); }
  .gauge b { position: absolute; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff;
    text-shadow: 0 1px 4px rgba(4, 8, 16, 0.95), 0 0 12px rgba(4, 8, 16, 0.7); }

  /* 文字层要独立于背景图保持可读:玻璃再透,字也要看得清 */
.copy { position: relative; z-index: 4; display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto;
    text-shadow: 0 1px 3px rgba(4, 8, 16, 0.9), 0 0 10px rgba(4, 8, 16, 0.55); }
  .copy .title { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .copy .dot { width: 7px; height: 7px; flex: none; border-radius: 2px; background: #4f7cf0; }
  .copy strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
  .copy .plan { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(238, 242, 250, 0.7); font-size: 9px; text-shadow: 0 1px 3px rgba(2, 6, 14, 0.5); }
  .copy .reset { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(238, 242, 250, 0.86); font-size: 10px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(2, 6, 14, 0.55); }
  .copy strong { text-shadow: 0 1px 4px rgba(2, 6, 14, 0.6); }
  .empty { position: relative; z-index: 4; width: 100%; text-align: center; color: rgba(238, 242, 250, 0.6); font-size: 11px; }

  .nav { position: relative; z-index: 4; display: flex; align-items: center; gap: 3px; flex: 0 0 auto; }
  .nav button {
    width: 22px; height: 30px; border: 1px solid transparent; border-radius: 999px;
    background: rgba(255, 255, 255, 0.07); color: rgba(238, 242, 250, 0.86);
    font: inherit; font-size: 10px; line-height: 1; cursor: pointer;
    transition: background 120ms ease-out, transform 90ms ease-out;
  }
  .nav button:hover { background: rgba(255, 255, 255, 0.16); }
  .nav button:active { transform: scale(0.9); }
  .nav .close { width: 22px; height: 22px; font-size: 13px; }

  /* 胶囊档:导航悬停浮现,平时整条宽度让给环与文案 —— 三颗常驻按钮会
     把 188px 的胶囊挤到文案归零、自己还被裁掉一半 */
  body[data-size='capsule'] .nav {
    position: absolute; z-index: 6; right: 4px; top: 50%;
    transform: translateY(-50%) translateX(6px);
    padding: 3px 4px 3px 26px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(6, 10, 18, 0), rgba(6, 10, 18, 0.55) 55%);
    opacity: 0; pointer-events: none;
    transition: opacity 150ms ease-out, transform 150ms ease-out;
  }
  body[data-size='capsule'] .glass:hover .nav {
    opacity: 1; pointer-events: auto;
    transform: translateY(-50%) translateX(0);
  }

  /* 放大后:环与信息铺开,胶囊过渡成小面板 */
  body[data-size='wide'] .glass { padding: 16px 18px; border-radius: 26px; align-items: stretch; }
  body[data-size='wide'] .gauge { width: 132px; height: 132px; }
  body[data-size='wide'] .gauge circle { stroke-width: 9; }
  body[data-size='wide'] .gauge b { font-size: 26px; }
  body[data-size='wide'] .copy strong { font-size: 15px; }
  body[data-size='wide'] .copy .plan { font-size: 10px; }
  body[data-size='wide'] .copy .reset { font-size: 12px; }
  body[data-size='wide'] .nav { flex-direction: column; justify-content: center; }
  body[data-size='wide'] .nav button { width: 34px; height: 34px; font-size: 12px; }
  body[data-size='wide'] .nav .close { width: 34px; height: 34px; font-size: 16px; }

  /* 极小档(拖到下限附近):只留环,文案彻底让位 */
  @media (max-width: 149px) {
    .copy { display: none; }
    .inner { justify-content: center; }
  }

  /* 拖边角缩放的手感区(右下角) */
  .grip {
    position: absolute; z-index: 5; right: 2px; bottom: 2px;
    width: 18px; height: 18px; cursor: nwse-resize;
  }
</style>
</head>
<body>
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <filter id="overlay-lens" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"></filter>
</svg>
<div class="glass" id="glass">
  <div class="lens"></div>
  <div class="veil"></div>
  <div class="inner" id="inner">
    <div class="gauge" id="gauge"></div>
    <div class="copy" id="copy">
      <span class="title"><span class="dot" aria-hidden="true"></span><strong id="title">Token Monitor</strong></span>
      <span class="plan" id="plan"></span>
      <span class="reset" id="reset"></span>
    </div>
    <div class="nav">
      <button id="prev" title="上一个套餐">▲</button>
      <button id="next" title="下一个套餐">▼</button>
      <button id="close" class="close" title="关闭悬浮窗">×</button>
    </div>
  </div>
  <div class="empty" id="empty" hidden>暂无套餐数据</div>
  <div class="grip" id="grip"></div>
</div>
<script>
  const COLORS = ['#1cb07a', '#f5ae34', '#e04a46'];
  const post = (message) => window.ipc?.postMessage?.(JSON.stringify(message));
  const glass = document.getElementById('glass');

  // 布局档位:按窗口宽度切胶囊/宽版,跟手
  function applySize() {
    document.body.dataset.size = window.innerWidth >= 300 ? 'wide' : 'capsule';
  }
  window.addEventListener('resize', applySize);
  applySize();

  // 液态玻璃折射贴图:胶囊/圆角矩形 SDF,边缘带内沿外法线外推,R=X / G=Y 通道
  // 编码(128=中性),喂给 feDisplacementMap。与 Dock 的差别:幅值在边界处归零、
  // 峰在带中部 —— 悬浮窗的"背景"只有窗口矩形这么大,位移采样一出界就是透明,
  // 边缘会发黑,所以折射只在带内鼓起。
  function buildDisplacementMap(width, height, radius, bezel = 14) {
    const w = Math.max(2, Math.ceil(width));
    const h = Math.max(2, Math.ceil(height));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    const image = ctx.createImageData(w, h);
    const data = image.data;
    for (let i = 0; i < w * h; i += 1) {
      const o = i * 4;
      data[o] = 128;
      data[o + 1] = 128;
      data[o + 3] = 255;
    }
    const r = Math.min(radius, w / 2, h / 2);
    let peak = 0;
    const lens = [];
    for (let y = 0; y < h; y += 1) {
      for (let x = 0; x < w; x += 1) {
        const px = x + 0.5;
        const py = y + 0.5;
        const qx = Math.abs(px - w / 2) - (w / 2 - r);
        const qy = Math.abs(py - h / 2) - (h / 2 - r);
        const ax = Math.max(qx, 0);
        const ay = Math.max(qy, 0);
        const sdf = Math.hypot(ax, ay) + Math.min(Math.max(qx, qy), 0) - r;
        const inside = -sdf; // 距边界深度,>0 在轮廓内
        if (inside <= 0 || inside > bezel) continue;
        let nx = 0;
        let ny = 0;
        if (ax > 0 || ay > 0) {
          const d = Math.hypot(ax, ay) || 1e-6;
          nx = Math.sign(px - w / 2) * (ax / d);
          ny = Math.sign(py - h / 2) * (ay / d);
        } else if (qx > qy) {
          nx = Math.sign(px - w / 2);
        } else {
          ny = Math.sign(py - h / 2);
        }
        const t = inside / bezel; // 0=带内沿 1=边界
        const m = (t * (1 - t)) ** 1.2 * 1.6;
        if (m > peak) peak = m;
        lens.push([y * w + x, nx, ny, m]);
      }
    }
    for (const [i, nx, ny, m] of lens) {
      const o = i * 4;
      data[o] = 128 + (nx * m / peak) * 127;
      data[o + 1] = 128 + (ny * m / peak) * 127;
    }
    ctx.putImageData(image, 0, 0);
    return { url: canvas.toDataURL(), width: w, height: h, scale: bezel * 0.72 };
  }

  // 贴图仅随元素尺寸/圆角重建(胶囊 999px 与宽版 26px 自动跟随)
  const lensFilter = document.getElementById('overlay-lens');
  function rebuildLens() {
    const rect = glass.getBoundingClientRect();
    if (rect.width < 12 || rect.height < 12) return;
    const radius = parseFloat(getComputedStyle(glass).borderTopLeftRadius) || rect.height / 2;
    const map = buildDisplacementMap(rect.width, rect.height, radius);
    lensFilter.innerHTML =
      `<feImage href="${map.url}" x="0" y="0" width="${map.width}" height="${map.height}" preserveAspectRatio="none" result="lens-map"></feImage>` +
      `<feGaussianBlur in="lens-map" stdDeviation="1.1" result="lens-soft"></feGaussianBlur>` +
      `<feDisplacementMap in="SourceGraphic" in2="lens-soft" scale="${map.scale}" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>`;
    glass.classList.add('lens-ready');
  }
  if (typeof ResizeObserver === 'function') new ResizeObserver(rebuildLens).observe(glass);
  rebuildLens();

  // Rust 每 500ms 推一帧真实桌面像素(拖动时 60ms 跟手)。
  // 抓帧在后台线程,到达顺序可能乱,只认帧号更大的,旧帧直接丢。
  window.__onBackdrop = (seq, uri) => {
    if (!uri) return;
    if (seq !== undefined && Number(glass.dataset.seq || 0) > seq) return;
    glass.dataset.seq = String(seq ?? 0);
    glass.style.setProperty('--backdrop', `url("${uri}")`);
    document.body.classList.remove('no-backdrop');
  };
  // overlay.rs 注入 __backdropSupported;抓不到像素时保持自绘玻璃
  (function watch(tries) {
    if (window.__backdropSupported !== undefined) {
      if (!window.__backdropSupported) document.body.classList.add('no-backdrop');
      return;
    }
    if (tries > 0) setTimeout(() => watch(tries - 1), 100);
    else document.body.classList.add('no-backdrop');
  })(10);

  function formatResets(ms) {
    const minutes = Math.max(1, Math.round(ms / 60000));
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h${minutes % 60 ? `${minutes % 60}m` : ''}`;
    return `${Math.floor(hours / 24)}d${hours % 24 ? `${hours % 24}h` : ''}`;
  }

  function render(data) {
    const gauge = document.getElementById('gauge');
    const copy = document.getElementById('copy');
    const empty = document.getElementById('empty');
    gauge.querySelectorAll('svg,b').forEach((node) => node.remove());
    const has = data.total && data.rings.length;
    empty.hidden = !!has;
    if (!has) {
      gauge.hidden = true;
      copy.querySelector('.plan').textContent = '';
      copy.querySelector('.reset').textContent = '';
      document.getElementById('title').textContent = data.total ? 'Token Monitor' : '暂无数据';
      return;
    }
    gauge.hidden = false;
    // 只画最紧的一环:胶囊里一枚环读得清,三环挤在一起反而糊
    const tightest = data.rings.reduce((a, b) => (b.usedPct > a.usedPct ? b : a));
    const color = COLORS[Math.min(tightest.level, 2)];
    const R = 24;
    const CIRC = 2 * Math.PI * R;
    const pct = Math.min(Math.max(tightest.usedPct, 0), 100);
    gauge.innerHTML =
      `<svg viewBox="0 0 58 58" aria-hidden="true">` +
      `<circle class="track" cx="29" cy="29" r="${R}"></circle>` +
      `<circle cx="29" cy="29" r="${R}" stroke="${color}" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - pct / 100)}"></circle>` +
      `</svg><b style="color:${color}">${Math.round(pct)}</b>`;

    document.getElementById('title').textContent = data.title;
    const plan = data.planType && data.planType !== data.title ? data.planType : '';
    copy.querySelector('.plan').textContent = plan ? `${plan} · ${tightest.label}` : tightest.label;
    copy.querySelector('.reset').textContent = tightest.resetsInMs != null
      ? `${formatResets(tightest.resetsInMs)} 后重置`
      : '';
    document.querySelector('.dot').style.background = color;
  }

  window.__onOverlayData = render;
  document.getElementById('close').addEventListener('pointerdown', (event) => event.stopPropagation());
  document.getElementById('close').addEventListener('click', () => post({ cmd: 'overlayHide' }));
  // 胶囊本体空白处拖动
  document.querySelector('.copy').addEventListener('pointerdown', () => post({ cmd: 'overlayDrag' }));
  document.getElementById('gauge').addEventListener('pointerdown', () => post({ cmd: 'overlayDrag' }));
  document.getElementById('prev').addEventListener('click', () => post({ cmd: 'overlaySwitch', direction: -1 }));
  document.getElementById('next').addEventListener('click', () => post({ cmd: 'overlaySwitch', direction: 1 }));
  // 边角提示:实际 resize 由 Rust 的 WM_NCHITTEST 处理(无边框窗系统默认不给手柄)
  document.getElementById('grip').addEventListener('pointerdown', (event) => event.stopPropagation());
</script>
</body>
</html>
