<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token Monitor 悬浮窗</title>
<style>
  :root {
    color-scheme: dark;
    /* 玻璃调参位:--glass-tint 是模糊桌面图之上的暗色覆膜(真毛玻璃的可读性靠它),
       0 = 全透(浅色壁纸上文字发虚),0.6+ = 发闷。0.46 配合 Rust 侧提饱和,
       玻璃透出底色层次的同时文字始终可读。 */
    --glass-tint: rgba(10, 13, 20, 0.46);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: "Sarasa Term SC Nerd", "Sarasa Mono SC", "Cascadia Mono", Consolas, monospace; }

  /* 胶囊玻璃:--backdrop 是 Rust 抓来的真实桌面像素(backdrop.rs 已做降采样+高斯化模糊+提饱和)。
     CSS 里 background-image 永远画在 background-color 之上,所以暗 tint 必须作为
     独立图层叠在图片上方,否则会被不透明背景图完全盖住(玻璃发白、文字看不清的根因)。
     图层自上而下:顶部高光 sheen / 底部内阴影 / 暗 tint / 桌面模糊图。
     玻璃边缘留 4px 不铺,让 tao 的 WM_NCHITTEST 拿到缩放命中。 */
  .glass {
    position: relative; isolation: isolate;
    display: flex; align-items: center;
    width: calc(100% - 8px); height: calc(100% - 8px);
    margin: 4px;
    padding: 8px 12px;
    border-radius: 999px;
    color: #eef2fa;
    overflow: hidden;
  }
  .glass::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    border-radius: inherit;
    background-color: var(--glass-tint);
    background-image:
      linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03) 30%, rgba(255, 255, 255, 0) 55%),
      linear-gradient(0deg, rgba(2, 6, 14, 0.34), rgba(2, 6, 14, 0) 34%),
      linear-gradient(var(--glass-tint), var(--glass-tint)),
      var(--backdrop, none);
    background-size: 100% 100%, 100% 100%, 100% 100%, calc(100% + 8px) calc(100% + 8px);
    background-position: center;
    background-repeat: no-repeat;
  }
  /* 抓不到桌面像素时(老系统/无权限):退化为自绘烟熏玻璃 */
  body.no-backdrop .glass::before {
    background: linear-gradient(165deg, #1c2537f2, #131a29ec 42%, #0b1018f5);
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  /* 镜面 rim:左上最亮 */
  .glass::after {
    content: ''; position: absolute; inset: 0; z-index: 1; border-radius: inherit; padding: 1px;
    background: linear-gradient(155deg, #ffffff6b, #ffffff1a 32%, transparent 55%, #ffffff14 80%, #ffffff47);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
  }
  .inner { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; }

  /* 环:默认态收成一枚,环外百分比 */
  .gauge { position: relative; flex: 0 0 auto; width: 58px; height: 58px; display: grid; place-items: center; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .gauge .track { stroke: rgba(255, 255, 255, 0.16); }
  .gauge b { position: absolute; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff;
    text-shadow: 0 1px 4px rgba(4, 8, 16, 0.95), 0 0 12px rgba(4, 8, 16, 0.7); }

  /* 文字层要独立于背景图保持可读:玻璃再透,字也要看得清 */
.copy { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto;
    text-shadow: 0 1px 3px rgba(4, 8, 16, 0.9), 0 0 10px rgba(4, 8, 16, 0.55); }
  .copy .title { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .copy .dot { width: 7px; height: 7px; flex: none; border-radius: 2px; background: #4f7cf0; }
  .copy strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
  .copy .plan { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(238, 242, 250, 0.7); font-size: 9px; text-shadow: 0 1px 3px rgba(2, 6, 14, 0.5); }
  .copy .reset { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(238, 242, 250, 0.86); font-size: 10px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(2, 6, 14, 0.55); }
  .copy strong { text-shadow: 0 1px 4px rgba(2, 6, 14, 0.6); }
  .empty { position: relative; z-index: 2; width: 100%; text-align: center; color: rgba(238, 242, 250, 0.6); font-size: 11px; }

  .nav { position: relative; z-index: 2; display: flex; align-items: center; gap: 3px; flex: 0 0 auto; }
  .nav button {
    width: 22px; height: 30px; border: 1px solid transparent; border-radius: 999px;
    background: rgba(255, 255, 255, 0.07); color: rgba(238, 242, 250, 0.86);
    font: inherit; font-size: 10px; line-height: 1; cursor: pointer;
    transition: background 120ms ease-out, transform 90ms ease-out;
  }
  .nav button:hover { background: rgba(255, 255, 255, 0.16); }
  .nav button:active { transform: scale(0.9); }
  .nav .close { width: 22px; height: 22px; font-size: 13px; }

  /* 放大后:环与信息铺开,胶囊过渡成小面板 */
  body[data-size='wide'] .glass { padding: 16px 18px; border-radius: 26px; align-items: stretch; }
  body[data-size='wide'] .gauge { width: 132px; height: 132px; }
  body[data-size='wide'] .gauge circle { stroke-width: 9; }
  body[data-size='wide'] .gauge b { font-size: 26px; }
  body[data-size='wide'] .copy strong { font-size: 15px; }
  body[data-size='wide'] .copy .plan { font-size: 10px; }
  body[data-size='wide'] .copy .reset { font-size: 12px; }
  body[data-size='wide'] .nav { flex-direction: column; justify-content: center; }
  body[data-size='wide'] .nav button { width: 34px; height: 34px; font-size: 12px; }
  body[data-size='wide'] .nav .close { width: 34px; height: 34px; font-size: 16px; }

  /* 拖边角缩放的手感区(右下角) */
  .grip {
    position: absolute; z-index: 3; right: 2px; bottom: 2px;
    width: 18px; height: 18px; cursor: nwse-resize;
  }
</style>
</head>
<body>
<div class="glass">
  <div class="inner" id="inner">
    <div class="gauge" id="gauge"></div>
    <div class="copy" id="copy">
      <span class="title"><span class="dot" aria-hidden="true"></span><strong id="title">Token Monitor</strong></span>
      <span class="plan" id="plan"></span>
      <span class="reset" id="reset"></span>
    </div>
    <div class="nav">
      <button id="prev" title="上一个套餐">▲</button>
      <button id="next" title="下一个套餐">▼</button>
      <button id="close" class="close" title="关闭悬浮窗">×</button>
    </div>
  </div>
  <div class="empty" id="empty" hidden>暂无套餐数据</div>
  <div class="grip" id="grip"></div>
</div>
<script>
  const COLORS = ['#1cb07a', '#f5ae34', '#e04a46'];
  const post = (message) => window.ipc?.postMessage?.(JSON.stringify(message));

  // 布局档位:按窗口宽度切胶囊/宽版,跟手
  function applySize() {
    document.body.dataset.size = window.innerWidth >= 300 ? 'wide' : 'capsule';
  }
  window.addEventListener('resize', applySize);
  applySize();

  // Rust 每 500ms 推一帧真实桌面像素(拖动时 60ms 跟手)。
  // 抓帧在后台线程,到达顺序可能乱,只认帧号更大的,旧帧直接丢。
  window.__onBackdrop = (seq, uri) => {
    if (!uri) return;
    const layer = document.querySelector('.glass');
    if (seq !== undefined && Number(layer.dataset.seq || 0) > seq) return;
    layer.dataset.seq = String(seq ?? 0);
    layer.style.setProperty('--backdrop', `url("${uri}")`);
    document.body.classList.remove('no-backdrop');
  };
  // overlay.rs 注入 __backdropSupported;抓不到像素时保持自绘玻璃
  (function watch(tries) {
    if (window.__backdropSupported !== undefined) {
      if (!window.__backdropSupported) document.body.classList.add('no-backdrop');
      return;
    }
    if (tries > 0) setTimeout(() => watch(tries - 1), 100);
    else document.body.classList.add('no-backdrop');
  })(10);

  function formatResets(ms) {
    const minutes = Math.max(1, Math.round(ms / 60000));
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h${minutes % 60 ? `${minutes % 60}m` : ''}`;
    return `${Math.floor(hours / 24)}d${hours % 24 ? `${hours % 24}h` : ''}`;
  }

  function render(data) {
    const gauge = document.getElementById('gauge');
    const copy = document.getElementById('copy');
    const empty = document.getElementById('empty');
    const inner = document.getElementById('inner');
    gauge.querySelectorAll('svg,b').forEach((node) => node.remove());
    const has = data.total && data.rings.length;
    empty.hidden = !!has;
    if (!has) {
      gauge.hidden = true;
      copy.querySelector('.plan').textContent = '';
      copy.querySelector('.reset').textContent = '';
      document.getElementById('title').textContent = data.total ? 'Token Monitor' : '暂无数据';
      return;
    }
    gauge.hidden = false;
    // 只画最紧的一环:胶囊里一枚环读得清,三环挤在一起反而糊
    const tightest = data.rings.reduce((a, b) => (b.usedPct > a.usedPct ? b : a));
    const color = COLORS[Math.min(tightest.level, 2)];
    const R = 24;
    const CIRC = 2 * Math.PI * R;
    const pct = Math.min(Math.max(tightest.usedPct, 0), 100);
    gauge.innerHTML =
      `<svg viewBox="0 0 58 58" aria-hidden="true">` +
      `<circle class="track" cx="29" cy="29" r="${R}"></circle>` +
      `<circle cx="29" cy="29" r="${R}" stroke="${color}" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - pct / 100)}"></circle>` +
      `</svg><b style="color:${color}">${Math.round(pct)}</b>`;

    document.getElementById('title').textContent = data.title;
    const plan = data.planType && data.planType !== data.title ? data.planType : '';
    copy.querySelector('.plan').textContent = plan ? `${plan} · ${tightest.label}` : tightest.label;
    copy.querySelector('.reset').textContent = tightest.resetsInMs != null
      ? `${formatResets(tightest.resetsInMs)} 后重置`
      : '';
    document.querySelector('.dot').style.background = color;
  }

  window.__onOverlayData = render;
  document.getElementById('close').addEventListener('pointerdown', (event) => event.stopPropagation());
  document.getElementById('close').addEventListener('click', () => post({ cmd: 'overlayHide' }));
  document.getElementById('drag').addEventListener?.('pointerdown', () => post({ cmd: 'overlayDrag' }));
  // 胶囊本体空白处拖动
  document.querySelector('.copy').addEventListener('pointerdown', () => post({ cmd: 'overlayDrag' }));
  document.getElementById('gauge').addEventListener('pointerdown', () => post({ cmd: 'overlayDrag' }));
  document.getElementById('prev').addEventListener('click', () => post({ cmd: 'overlaySwitch', direction: -1 }));
  document.getElementById('next').addEventListener('click', () => post({ cmd: 'overlaySwitch', direction: 1 }));
  // 边角提示:实际 resize 由 Rust 的 WM_NCHITTEST 处理(无边框窗系统默认不给手柄)
  document.getElementById('grip').addEventListener('pointerdown', (event) => event.stopPropagation());
</script>
</body>
</html>
