[package]
name = "quotakeeper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal monitor for AI coding CLI usage & quota: burn rate, heatmap, model leaderboard, subscription plan cards"
license = "MIT"
repository = "https://github.com/jryang1997/QuotaKeeper"
keywords = ["tui", "claude-code", "codex", "tokens", "quota"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 钉 0.4.38:0.4.40+ 的 Windows Local 走 windows-link raw-dylib(import_name_type=
# "undecorated" + "+verbatim"),在本机 WinLibs GCC(ld)的 windows-gnu 目标上生成
# 坏导入 thunk,首次调用即 STATUS_ACCESS_VIOLATION(2026-09-25 实测).升级前先验证 Local.
chrono = "=0.4.38"
ureq = { version = "2", features = ["json", "proxy-from-env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
