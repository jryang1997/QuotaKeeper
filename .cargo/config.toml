# windows-gnu 目标统一用工具链自带 rust-lld 链接:WinLibs GCC 的 GNU ld 对
# chrono 0.4.40+ / windows-result 等 api-set raw-dylib 导入会生成坏导入表,
# 进程初始化即 ACCESS_VIOLATION(chrono 已钉 0.4.38 双保险,见根 Cargo.toml)。
#
# CC/AR(编译 bundled SQLite 等 C 代码)与本机默认 target 不在仓库固化:
# 需要固定 GNU 目标的机器,在用户级 ~/.cargo/config.toml 里自行配置,例如
#   [build]
#   target = "x86_64-pc-windows-gnu"
#   [env]
#   CC_x86_64_pc_windows_gnu = "…/mingw64/bin/gcc.exe"
#   AR_x86_64_pc_windows_gnu = "…/mingw64/bin/ar.exe"
# 其余平台用宿主默认工具链即可(见 README「构建」一节)。
[target.x86_64-pc-windows-gnu]
linker = "rust-lld"
