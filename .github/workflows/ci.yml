name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows-msvc:
    # 用户视角的默认路径:stable 工具链宿主目标(MSVC),cargo build/test 开箱即用
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: 构建内嵌前端
        working-directory: gui/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: 检查内嵌前端与源码一致
        shell: pwsh
        run: |
          $changes = git status --porcelain -- gui/frontend/dist
          if ($changes) {
            $changes | ForEach-Object { Write-Host $_ }
            throw 'gui/frontend/dist 与前端源码不一致；请重新运行 npm run build 并提交产物'
          }
      - name: TUI 测试
        run: cargo test
      - name: GUI 编译检查
        run: cargo check --manifest-path gui/Cargo.toml

  windows-gnu:
    # 项目第一公民目标:GNU host 工具链(与作者本机完全一致,rust-lld +
    # runner 预装 MinGW 编译 C)。RUSTUP_TOOLCHAIN 覆盖 repo 的
    # rust-toolchain.toml(channel=stable 会解析成 MSVC host,交叉构建
    # 的 self-contained CRT 行为与 GNU host 不同,故不用 --target)。
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CC_x86_64_pc_windows_gnu: gcc
      AR_x86_64_pc_windows_gnu: ar
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - name: 确认 MinGW 可用(runner 预装)
        run: |
          gcc --version
          ar --version
      - name: TUI 测试(GNU)
        run: cargo test
      - name: GUI 测试(GNU)
        run: cargo test --manifest-path gui/Cargo.toml

  linux:
    # 跨平台门槛:核心 crate 在 Linux 上可编译可测试(cfg(windows) 路径全部旁路)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  minimum-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 check --locked

  minimum-gui-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo +1.90.0 check --locked --manifest-path gui/Cargo.toml
